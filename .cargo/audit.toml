[advisories]
# Transitive through russh's RSA key support; RUSTSEC reports no fixed release.
# rneter rejects in-process RSA private-key authentication by default and only
# permits it through an explicit SshAuthMethod opt-in. ssh-agent,
# Ed25519, and ECDSA authentication do not exercise the vulnerable RSA code.
# Remove this exception when russh moves to a patched implementation.
ignore = ["RUSTSEC-2023-0071"]
