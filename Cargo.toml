[package]
name = "rneter"
version = "0.4.7"
edition = "2024"
rust-version = "1.88"
authors = ["demohiiiii"]
license = "MIT"
description = "SSH connection manager for network devices with intelligent state machine handling"
documentation = "https://docs.rs/rneter"
repository = "https://github.com/demohiiiii/rneter"
homepage = "https://github.com/demohiiiii/rneter"
readme = "README.md"
keywords = ["ssh", "network", "device", "automation", "cisco"]
categories = ["network-programming", "asynchronous"]

[features]
# In-process fake SSH devices for testing rneter-based automation.
# Downstream crates enable this in dev-dependencies to simulate devices.
testkit = ["dep:rand_core"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
russh = { version = "0.55.0", features = ["des", "dsa"] }
rand_core = { version = "0.6.4", features = ["getrandom"], optional = true }
async-ssh2-tokio = { version = "0.12.2" }
tokio = { version = "1", features = ["fs", "rt-multi-thread"] }
moka = { version = "0.12.13", features = ["future"] }
once_cell = "1.21.3"
regex = "1.12.2"
serde = "1.0.219"
serde_json = "1.0.149"
log = "0.4.27"
thiserror = "2.0.12"
anyhow = "1.0.98"
schemars = { version = "0.9.0" }
sha2 = "0.10.8"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "time", "io-util", "sync"] }

[[example]]
name = "virtual_device"
required-features = ["testkit"]

[[test]]
name = "fake_device_e2e"
required-features = ["testkit"]

[[test]]
name = "builtin_templates_e2e"
required-features = ["testkit"]

[[test]]
name = "fleet_e2e"
required-features = ["testkit"]

[[test]]
name = "testkit_faults_e2e"
required-features = ["testkit"]

[[test]]
name = "retry_e2e"
required-features = ["testkit"]
